services:
  # HTTP API: несколько реплик на портах 8080–8082, общая SQLite в ./data
  api:
    # Сборка образа из Dockerfile в корне проекта
    build: .

    # Имена контейнеров задаёт Compose (api-1, api-2, …).
    # container_name здесь нельзя: при replicas: 3 имена должны быть уникальными.

    # Диапазон хост-портов → порт 8080 внутри каждого контейнера
    ports:
      - "8080-8082:8080"

    # Общая папка data/ на хосте для всех экземпляров (shop.db)
    volumes:
      - ./data:/app/data

    # Секрет подписи JWT (обязательно смените в проде)
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}

    # Перезапуск, если контейнер упал (кроме ручного stop)
    restart: unless-stopped

    # Масштабирование: 3 одинаковых экземпляра сервиса api
    deploy:
      replicas: 3
